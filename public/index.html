<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f7fb">
<title>Ploegbaas</title>
<style>
  :root{
    --bg:#f4f7fb; --kaart:#ffffff; --lijn:#e3eaf4; --tekst:#0f172a; --zacht:#5b6b82;
    --accent:#2ea3f2; --diep:#1e73be; --goed:#1f9d55; --let:#d97706; --fout:#dc2626;
    --r:14px; --schaduw:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tekst);
    font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  a{color:var(--diep);text-decoration:none}
  button{font:inherit}
  .doos{display:flex;min-height:100vh}
  /* zijbalk */
  aside{width:238px;flex:0 0 238px;background:var(--kaart);border-right:1px solid var(--lijn);
    padding:18px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
  .merk{display:flex;align-items:center;gap:10px;padding:2px 6px}
  .merk svg{flex:0 0 34px}
  .merk b{font-size:18px;letter-spacing:-.2px;display:block;line-height:1.1}
  .merk span{font-size:12px;color:var(--zacht)}
  nav{display:flex;flex-direction:column;gap:2px}
  nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--tekst);font-weight:500}
  nav a:hover{background:#eef4fb}
  nav a.aan{background:linear-gradient(90deg,#e8f4fe,#f2f9ff);color:var(--diep);font-weight:600}
  nav .kop{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--zacht);margin:14px 10px 4px}
  .tel{background:var(--accent);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;margin-left:auto}
  /* versie en bijwerken */
  .versie-blok{border-top:1px solid var(--lijn);padding-top:12px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
  .versie-blok .rij{display:flex;align-items:center;gap:8px;font-size:13px}
  .versie-blok code,dd code{font-size:12px;background:#eef4fb;border-radius:6px;padding:1px 6px;color:var(--diep);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .stip-nieuw{width:8px;height:8px;border-radius:999px;background:var(--accent);box-shadow:0 0 0 3px #e8f4fe;flex:0 0 8px}
  .doek{position:fixed;inset:0;background:rgba(15,23,42,.42);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
  .bijwerk{background:var(--kaart);border-radius:18px;border:1px solid var(--lijn);box-shadow:0 20px 50px rgba(15,23,42,.25);width:min(640px,100%);max-height:88vh;overflow:auto}
  .bijwerk-kop{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--lijn)}
  .bijwerk-kop b{font-size:16px}
  .bijwerk-kop .rechts{margin-left:auto}
  .bijwerk-lijf{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
  .versie-tabel{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:13px;margin:0}
  .versie-tabel dt{color:var(--zacht);white-space:nowrap}
  .versie-tabel dd{margin:0}
  .logvak{background:#0f172a;color:#d7e3f4;border-radius:10px;padding:12px;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;max-height:220px;overflow:auto}
  .bijwerk-voet{display:flex;gap:10px;align-items:center;padding:14px 18px;border-top:1px solid var(--lijn);flex-wrap:wrap}
  .bijwerk-voet .rechts{margin-left:auto}
  /* agent koppelen */
  .koppel{margin-top:16px;overflow:hidden}
  .koppel-kop{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--lijn)}
  .koppel-kop b{font-size:15px}
  .koppel-kop .rechts{margin-left:auto}
  .koppel-lijf{padding:16px;display:flex;flex-direction:column;gap:10px}
  .koppel-lijf .stap{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--zacht);margin-top:6px}
  .koppel-lijf .stap b{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:999px;
    background:linear-gradient(180deg,#5ff0e8,#2ea3f2);color:#fff;font-size:11px;margin-right:7px}
  .adapter-keuze{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
  .adapter-kaart{display:flex;flex-direction:column;gap:5px;text-align:left;background:#fbfdff;border:1.5px solid var(--lijn);
    border-radius:12px;padding:12px;cursor:pointer;color:var(--tekst);transition:border-color .15s,background .15s}
  .adapter-kaart:hover{border-color:#bcd9f2;background:#f7fbff}
  .adapter-kaart.aan{border-color:var(--accent);background:linear-gradient(180deg,#f2fbff,#ffffff);box-shadow:0 0 0 3px #e8f4fe}
  .adapter-kaart b{font-size:13.5px}
  .adapter-kaart span{font-size:12px;color:var(--zacht);line-height:1.45}
  .adapter-kaart em{font-size:11.5px;color:var(--diep);font-style:normal;margin-top:2px}
  .adaptervelden{background:#fbfdff;border:1px dashed var(--lijn);border-radius:12px;padding:12px;margin-top:2px}
  .proef{background:#fbfdff;border:1px solid var(--lijn);border-radius:12px;padding:12px;font-size:13px}
  .proef.goed{background:#f2fbf5;border-color:#bfe8ce}
  .proef.fout{background:#fdf4f4;border-color:#f3c9c9}
  .koppel-voet{display:flex;gap:10px;align-items:center;padding:13px 16px;border-top:1px solid var(--lijn);flex-wrap:wrap}
  .koppel-voet .rechts{margin-left:auto}
  /* hoofd */
  main{flex:1;min-width:0;padding:22px 26px 60px}
  h1{font-size:22px;margin:0 0 4px;letter-spacing:-.3px}
  h2{font-size:16px;margin:26px 0 12px}
  .onder{color:var(--zacht);font-size:13px;margin:0 0 18px}
  .kaarten{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px}
  .kaart{background:var(--kaart);border:1px solid var(--lijn);border-radius:var(--r);padding:15px 16px;box-shadow:var(--schaduw)}
  .kaart .cijfer{font-size:27px;font-weight:700;letter-spacing:-.5px}
  .kaart .naam{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--zacht);margin-bottom:6px}
  .kaart .bij{font-size:12px;color:var(--zacht);margin-top:4px}
  .paneel{background:var(--kaart);border:1px solid var(--lijn);border-radius:var(--r);box-shadow:var(--schaduw);overflow:hidden}
  .paneel-kop{padding:13px 16px;border-bottom:1px solid var(--lijn);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .paneel-kop b{font-size:14px}
  .paneel-kop .rechts{margin-left:auto;display:flex;gap:8px;align-items:center}
  .twee{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start}
  @media(max-width:950px){.twee{grid-template-columns:1fr} aside{position:static;height:auto}}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:10px 16px;border-bottom:1px solid var(--lijn);vertical-align:top}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--zacht)}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#fafcff}
  .pil{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
  .nieuw{background:#e8f4fe;color:#1e73be}
  .bezig{background:#fff4e5;color:#b45309}
  .review{background:#ede9fe;color:#6d28d9}
  .klaar{background:#e7f7ee;color:#15803d}
  .geblokkeerd{background:#fdeaea;color:#b91c1c}
  .actief{background:#e7f7ee;color:#15803d}
  .gepauzeerd{background:#eef2f7;color:#64748b}
  .lopend{background:#fff4e5;color:#b45309}
  .geslaagd{background:#e7f7ee;color:#15803d}
  .mislukt{background:#fdeaea;color:#b91c1c}
  .gestopt{background:#eef2f7;color:#64748b}
  .knop{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:8px 13px;font-weight:600;cursor:pointer}
  .knop:hover{background:var(--diep)}
  .knop.los{background:#eef4fb;color:var(--diep)}
  .knop.los:hover{background:#e0edfa}
  .knop.rood{background:#fdeaea;color:#b91c1c}
  .knop.klein{padding:5px 10px;font-size:13px}
  .veld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
  .veld label{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--zacht)}
  input,select,textarea{font:inherit;padding:9px 11px;border:1px solid var(--lijn);border-radius:10px;background:#fff;color:var(--tekst);width:100%}
  textarea{min-height:110px;resize:vertical}
  .rij{display:flex;gap:12px}.rij>*{flex:1}
  .bericht{padding:11px 14px;border-radius:12px;background:#f7fafd;border:1px solid var(--lijn);margin-bottom:10px;white-space:pre-wrap}
  .bericht.mens{background:#eff8ff;border-color:#cfe8fb}
  .bericht .kop{font-size:12px;color:var(--zacht);margin-bottom:5px;display:flex;gap:8px}
  .log{background:#0f172a;color:#e2e8f0;border-radius:12px;padding:14px;font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;
    max-height:440px;overflow:auto;white-space:pre-wrap}
  .leeg{padding:34px 16px;text-align:center;color:var(--zacht)}
  .balk{display:flex;align-items:flex-end;gap:5px;height:132px;padding:14px 16px 4px}
  .balk .pijler{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;min-width:0}
  .balk .stuk{background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
  .balk .stuk.mislukt{background:#f0a3a3}
  .balk .dag{font-size:10px;color:var(--zacht);text-align:center;margin-top:4px}
  .inlog{min-height:100vh;display:grid;place-items:center;padding:20px}
  .inlog .kaart{width:100%;max-width:390px;padding:26px}
  .inlog h1{font-size:20px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .zacht{color:var(--zacht);font-size:13px}
  code{background:#eef4fb;border-radius:6px;padding:1px 6px;font-size:13px}
  .legende{display:flex;gap:14px;font-size:12px;color:var(--zacht);padding:0 16px 12px}
  .stip{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px}
</style>
</head>
<body>
<div id="app" class="doos"></div>

<script>
const S = {
  pad: location.hash.replace(/^#/, '') || '/dashboard',
  ingelogd: null, overzicht: null, taken: [], agenten: [], runs: [], goedkeuringen: [],
  routines: [], activiteit: [], bedrijven: [], taak: null, runLog: null, filterStatus: '', zoek: '',
  ontdek: null, agentAdapter: null, snelUitslag: '',
  versie: null, bijwerkenOpen: false, bijwerkLog: null, pollt: false,
};

async function api(pad, opties = {}) {
  const antwoord = await fetch('/api' + pad, {
    method: opties.method || 'GET',
    headers: { 'Content-Type': 'application/json' },
    body: opties.lijf ? JSON.stringify(opties.lijf) : undefined,
  });
  if (antwoord.status === 401) { S.ingelogd = false; teken(); throw new Error('niet ingelogd'); }
  const data = await antwoord.json().catch(() => ({}));
  if (!antwoord.ok) throw new Error(data.fout || 'Er ging iets mis');
  return data;
}
const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const tijd = (iso) => iso ? new Date(iso).toLocaleString('nl-NL', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '—';
const euro = (centen) => '€ ' + (Number(centen || 0) / 100).toFixed(2).replace('.', ',');
const pil = (soort, tekst) => `<span class="pil ${soort}">${esc(tekst || soort)}</span>`;
const STATUS_TAK = { nieuw: 'nieuw', bezig: 'bezig', review: 'nakijken', klaar: 'klaar', geblokkeerd: 'geblokkeerd' };

function ga(pad) { location.hash = '#' + pad; }

function tekenMerk() {
  return `<div class="merk">
    <svg viewBox="0 0 40 40" width="34" height="34" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#5ff0e8"/><stop offset=".5" stop-color="#2ea3f2"/><stop offset="1" stop-color="#1e73be"/>
      </linearGradient></defs>
      <rect x="2" y="2" width="36" height="36" rx="11" fill="url(#g)"/>
      <path d="M12 27V13h5.4c3.2 0 5.1 1.6 5.1 4.2 0 2.1-1.2 3.5-3.2 4l4.4 5.8h-4.3l-3.8-5.3H16V27z" fill="#fff"/>
      <circle cx="28.5" cy="15" r="2.4" fill="#fff" opacity=".85"/>
    </svg>
    <div><b>Ploegbaas</b><span>jouw ploeg AI-agenten</span></div>
  </div>`;
}

function tekenZijbalk() {
  const open = S.overzicht?.kpi?.taken_nakijken ?? 0;
  const link = (pad, naam) => `<a href="#${pad}" class="${S.pad.startsWith(pad) ? 'aan' : ''}">${naam}${
    pad === '/goedkeuringen' && open ? `<span class="tel">${open}</span>` : ''}</a>`;
  return `<aside>
    ${tekenMerk()}
    <nav>
      ${link('/dashboard', 'Dashboard')}
      <div class="kop">Werk</div>
      ${link('/taken', 'Taken')}
      ${link('/goedkeuringen', 'Nakijken')}
      ${link('/routines', 'Routines')}
      <div class="kop">Ploeg</div>
      ${link('/agenten', 'Agenten')}
      ${link('/runs', 'Runs')}
      ${link('/activiteit', 'Logboek')}
      ${link('/meldingen', 'Meldingen')}
    </nav>
    <div style="margin-top:auto">
      ${tekenVersieBlok()}
      <button class="knop los klein" onclick="uitloggen()" style="width:100%">Uitloggen</button>
    </div>
  </aside>`;
}

function tekenVersieBlok() {
  const v = S.versie;
  const kort = v?.huidig?.kort || 'onbekend';
  const nieuw = Boolean(v?.beschikbaar);
  return `<div class="versie-blok">
    <div class="rij">
      ${nieuw ? '<span class="stip-nieuw"></span>' : ''}
      <span class="zacht">versie</span><code>${esc(kort)}</code>
    </div>
    ${nieuw ? '<div class="zacht" style="font-size:12px">Er staat een nieuwe versie klaar.</div>' : ''}
    <button class="knop ${nieuw ? '' : 'los'} klein" onclick="openBijwerken()" style="width:100%">Bijwerken</button>
  </div>`;
}

async function uitloggen() { await api('/uitloggen', { method: 'POST' }); S.ingelogd = false; teken(); }

function grafiek(perDag) {
  const hoogte = 100;
  const max = Math.max(1, ...perDag.map((d) => d.gelukt + d.mislukt + d.lopend));
  return `<div class="balk">${perDag.map((d) => {
    const totaal = d.gelukt + d.mislukt + d.lopend;
    const h = Math.round((d.gelukt / max) * hoogte);
    const hm = Math.round((d.mislukt / max) * hoogte);
    const hl = Math.round((d.lopend / max) * hoogte);
    return `<div class="pijler" title="${d.dag}: ${totaal} run(s)">
      <div class="stuk mislukt" style="height:${hl}px;background:#fbd6a7"></div>
      <div class="stuk mislukt" style="height:${hm}px"></div>
      <div class="stuk" style="height:${h}px"></div>
      <div class="dag">${d.dag.slice(8)}</div>
    </div>`;
  }).join('')}</div>
  <div class="legende"><span><i class="stip" style="background:#2ea3f2"></i>geslaagd</span>
    <span><i class="stip" style="background:#f0a3a3"></i>mislukt</span>
    <span><i class="stip" style="background:#fbd6a7"></i>loopt</span></div>`;
}

function tekenDashboard() {
  const o = S.overzicht; if (!o) return '<main><div class="leeg">Laden…</div></main>';
  const k = o.kpi;
  return `<main>
    <h1>Dashboard</h1>
    <p class="onder">Wat je ploeg nu doet — ${new Date().toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long' })}</p>
    <div class="kaarten">
      <div class="kaart"><div class="naam">Agenten actief</div><div class="cijfer">${k.agenten_actief}<span class="zacht" style="font-size:15px">/${k.agenten_totaal}</span></div>
        <div class="bij">${k.runs_lopend} run(s) lopen nu</div></div>
      <div class="kaart"><div class="naam">Taken open</div><div class="cijfer">${k.taken_open}</div>
        <div class="bij">${k.taken_geblokkeerd} geblokkeerd</div></div>
      <div class="kaart"><div class="naam">Wacht op nakijken</div><div class="cijfer">${k.taken_nakijken}</div>
        <div class="bij"><a href="#/goedkeuringen">keuren</a></div></div>
      <div class="kaart"><div class="naam">Runs vandaag</div><div class="cijfer">${k.runs_vandaag}</div>
        <div class="bij">kosten deze maand ${euro(k.kosten_maand_centen)}</div></div>
    </div>

    <div class="twee" style="margin-top:18px">
      <div class="paneel"><div class="paneel-kop"><b>Runs, laatste 14 dagen</b></div>${grafiek(o.per_dag)}</div>
      <div class="paneel"><div class="paneel-kop"><b>Ploeg</b><span class="rechts"><a class="knop los klein" href="#/agenten">Beheren</a></span></div>
        <table><tbody>${o.agenten.map((a) => `<tr>
          <td><b>${esc(a.naam)}</b><div class="zacht">${esc(a.titel || a.rol)}</div></td>
          <td style="width:1%">${pil(a.status)}</td>
          <td style="width:1%"><button class="knop los klein" onclick="wek(${a.id})">wek</button></td></tr>`).join('')
          || '<tr><td class="leeg">Nog geen agenten</td></tr>'}</tbody></table>
      </div>
    </div>

    <h2>Recente taken</h2>
    <div class="paneel"><table>
      <thead><tr><th>Taak</th><th>Agent</th><th>Status</th><th>Bijgewerkt</th></tr></thead>
      <tbody>${o.recente_taken.map((t) => `<tr onclick="ga('/taken/${t.id}')" style="cursor:pointer">
        <td><b>${esc(t.titel)}</b><div class="zacht">#${t.id} · ${esc(t.labels || '')}</div></td>
        <td>${esc(t.agent_naam || '—')}</td><td>${pil(t.status, STATUS_TAK[t.status])}</td><td class="zacht">${tijd(t.bijgewerkt)}</td>
      </tr>`).join('') || '<tr><td class="leeg">Nog geen taken</td></tr>'}</tbody></table></div>

    <h2>Logboek</h2>
    <div class="paneel"><table><tbody>${o.activiteit.map((a) => `<tr>
      <td class="zacht" style="width:1%">${tijd(a.tijd)}</td><td>${esc(a.tekst)}</td></tr>`).join('')}</tbody></table></div>
  </main>`;
}

function tekenTaken() {
  let rijen = S.taken;
  if (S.filterStatus) rijen = rijen.filter((t) => t.status === S.filterStatus);
  if (S.zoek) rijen = rijen.filter((t) => (t.titel + t.omschrijving).toLowerCase().includes(S.zoek.toLowerCase()));
  const statussen = ['', 'nieuw', 'bezig', 'review', 'klaar', 'geblokkeerd'];
  return `<main>
    <h1>Taken</h1>
    <p class="onder">Alles wat de ploeg doet, met per taak wie eraan werkt en wat eruit kwam.</p>
    <div class="toolbar">
      <button class="knop" onclick="nieuweTaak()">Nieuwe taak</button>
      ${statussen.map((s) => `<button class="knop ${S.filterStatus === s ? '' : 'los'} klein" onclick="S.filterStatus='${s}';teken()">${
        s ? STATUS_TAK[s] : 'alles'}</button>`).join('')}
      <input style="max-width:230px;margin-left:auto" placeholder="Zoeken…" value="${esc(S.zoek)}"
        oninput="S.zoek=this.value;tekenLijst()" id="zoekveld">
    </div>
    <div class="paneel" id="takenlijst">${tekenTakenLijst(rijen)}</div>
    <div id="formulier"></div>
  </main>`;
}

function tekenTakenLijst(rijen) {
  return `<table><thead><tr><th>Taak</th><th>Agent</th><th>Prioriteit</th><th>Status</th><th>Bijgewerkt</th></tr></thead>
    <tbody>${rijen.map((t) => `<tr onclick="ga('/taken/${t.id}')" style="cursor:pointer">
      <td><b>${esc(t.titel)}</b><div class="zacht">#${t.id}${t.labels ? ' · ' + esc(t.labels) : ''}${
        t.aantal_berichten ? ' · ' + t.aantal_berichten + ' bericht(en)' : ''}</div></td>
      <td>${esc(t.agent_naam || '—')}</td><td class="zacht">${esc(t.prioriteit)}</td>
      <td>${pil(t.status, STATUS_TAK[t.status])}</td><td class="zacht">${tijd(t.bijgewerkt)}</td></tr>`).join('')
      || '<tr><td colspan="5" class="leeg">Geen taken met deze filter.</td></tr>'}</tbody></table>`;
}
function tekenLijst() {
  let rijen = S.taken;
  if (S.filterStatus) rijen = rijen.filter((t) => t.status === S.filterStatus);
  if (S.zoek) rijen = rijen.filter((t) => (t.titel + t.omschrijving).toLowerCase().includes(S.zoek.toLowerCase()));
  const vak = document.getElementById('takenlijst');
  if (vak) vak.innerHTML = tekenTakenLijst(rijen);
}

function nieuweTaak() {
  const standaard = Number((S.meldingen && S.meldingen.standaard_agent) || 0);
  document.getElementById('formulier').innerHTML = `<div class="paneel" style="margin-top:16px;padding:16px">
    <h2 style="margin-top:0">Nieuwe taak</h2>
    <div class="veld"><label>Titel</label><input id="t-titel" placeholder="Wat moet er gebeuren?"></div>
    <div class="veld"><label>Omschrijving</label><textarea id="t-oms" placeholder="Context, eisen, waar het resultaat heen moet…"></textarea></div>
    <div class="rij">
      <div class="veld"><label>Agent</label><select id="t-agent"><option value="">— niet toegewezen —</option>
        ${S.agenten.map((a) => `<option value="${a.id}"${a.id === standaard ? ' selected' : ''}>${esc(a.naam)}</option>`).join('')}</select>
        <div class="zacht" style="font-size:12px;margin-top:6px">${standaard ? 'Standaard: ' + esc((S.agenten.find((a) => a.id === standaard) || {}).naam || '') + ' — te wijzigen bij Meldingen → Nieuwe taken.' : 'Nog geen standaardagent; stel die in bij Meldingen → Nieuwe taken.'}</div></div>
      <div class="veld"><label>Prioriteit</label><select id="t-prio"><option value="normaal">normaal</option>
        <option value="hoog">hoog</option><option value="laag">laag</option></select></div>
      <div class="veld"><label>Labels</label><input id="t-labels" placeholder="bijv. website"></div>
    </div>
    <button class="knop" onclick="bewaarTaak()">Aanmaken</button>
    <button class="knop los" onclick="document.getElementById('formulier').innerHTML=''">Annuleren</button>
  </div>`;
  document.getElementById('t-titel').focus();
}

async function bewaarTaak() {
  const titel = document.getElementById('t-titel').value.trim();
  if (!titel) return alert('Geef een titel.');
  const taak = await api('/taken', { method: 'POST', lijf: {
    titel, omschrijving: document.getElementById('t-oms').value,
    agent_id: document.getElementById('t-agent').value || null,
    prioriteit: document.getElementById('t-prio').value,
    labels: document.getElementById('t-labels').value,
  } });
  ga('/taken/' + taak.id);
}

function tekenTaak() {

          <div class="veld"><label>Omschrijving</label>

          <div class="rij">
            <div class="veld"><label>Agent</label><select id="d-agent">
              <option value="">— niet toegewezen —</option>
              ${S.agenten.map((a) => `<option value="${a.id}" ${a.id === t.agent_id ? 'selected' : ''}>${esc(a.naam)}</option>`).join('')}

            <div class="veld"><label>Status</label><select id="d-status">

            <div class="veld"><label>Prioriteit</label><select id="d-prio">
              ${['laag', 'normaal', 'hoog'].map((p) => `<option value="${p}" ${p === t.prioriteit ? 'selected' : ''}>${p}</option>`).join('')}
            </select></div>
          </div>
          <button class="knop" onclick="bewaarTaakVelden(${t.id})">Opslaan</button>
          ${t.agent_id && t.status === 'nieuw' ? `<button class="knop los" onclick="wek(${t.agent_id})">Nu laten beginnen</button>` : ''}
          ${t.status === 'geblokkeerd' ? `<button class="knop los" onclick="herenig(${t.id})">Opnieuw aanbieden</button>` : ''}
        </div>

        <h2>Overleg</h2>
        ${(t.berichten || []).map((b) => `<div class="bericht ${b.van_soort === 'mens' ? 'mens' : ''}">
          <div class="kop"><b>${esc(b.van_naam || b.van_soort)}</b> ${tijd(b.tijd)}</div>${esc(b.tekst)}</div>`).join('')

          <button class="knop" onclick="stuurBericht(${t.id})">Versturen</button>

        </div>
      </div>

      <div>
        ${open ? `<div class="paneel" style="padding:16px;border-color:#ddd6fe">
          <b>Wacht op jouw oordeel</b>
          <p class="zacht">De agent meldt deze taak klaar. Keur goed, of stuur hem terug met uitleg.</p>
          <div class="veld"><label>Opmerking (optioneel)</label><input id="g-op"></div>
          <button class="knop" onclick="keur(${t.id}, true)">Goedkeuren</button>
          <button class="knop rood" onclick="keur(${t.id}, false)">Terug naar agent</button>
        </div>` : ''}

        <div class="paneel" style="margin-top:16px">
          <div class="paneel-kop"><b>Runs van deze taak</b></div>
          <table><tbody>${(t.runs || []).map((r) => `<tr onclick="bekijkRun(${r.id})" style="cursor:pointer">
            <td>#${r.id}</td><td>${pil(r.status)}</td><td class="zacht">${tijd(r.gestart)}</td>
            <td class="zacht">${r.kosten_centen ? euro(r.kosten_centen) : '—'}</td></tr>`).join('')
            || '<tr><td class="leeg">Nog geen run</td></tr>'}</tbody></table>

async function bewaarTaakVelden(id) {
  await api('/taken/' + id, { method: 'PATCH', lijf: {
    omschrijving: document.getElementById('d-oms').value,
    agent_id: document.getElementById('d-agent').value || null,
    status: document.getElementById('d-status').value,
    prioriteit: document.getElementById('d-prio').value,
  } });
  laadTaak(id);
}
async function stuurBericht(id) {
  const tekst = document.getElementById('b-tekst').value.trim();
  if (!tekst) return;
  await api(`/taken/${id}/bericht`, { method: 'POST', lijf: { tekst } });
  laadTaak(id);
}
async function keur(id, goed) {
  await api(`/taken/${id}/${goed ? 'keur-goed' : 'keur-af'}`, { method: 'POST', lijf: { opmerking: document.getElementById('g-op')?.value || '' } });
  laadTaak(id);
}
async function herenig(id) {
  await api(`/taken/${id}`, { method: 'PATCH', lijf: { status: 'nieuw' } });
  laadTaak(id);
}

function tekenAgenten() {
  zorgOntdek();
  const o = S.ontdek;
  return `<main>
    <h1>Agenten</h1>
    <p class="onder">Koppelen in vier stappen: hoe hij werkt, wie hij is, waarmee en hoeveel — en dan een echte proef.</p>

          ${a.status === 'actief'
            ? `<button class="knop los klein" onclick="agentActie(${a.id},'pauzeer')">pauzeer</button>`

          <button class="knop los klein" onclick="wek(${a.id})">wek</button>
          <button class="knop los klein" onclick="bewerkAgent(${a.id})">bewerk</button>
        </td></tr>`).join('') || '<tr><td colspan="7" class="leeg">Nog geen agenten. Koppel er een met de knop hierboven.</td></tr>'}</tbody></table></div>
    <div id="agentformulier"></div>
    <h2>Wat de adapters doen</h2>
    <div class="paneel" style="padding:16px">
      <p><b>hermes</b> — start de Hermes Agent op deze machine met de taak als opdracht. Dit is de adapter die je hier het meest gebruikt.</p>
      <p><b>opdracht</b> — draait een eigen shell-commando. De taak staat in de omgeving als <code>PLOEGBAAS_TAAK_OMSCHRIJVING</code>.</p>
      <p><b>http</b> — stuurt de taak als JSON naar een eigen endpoint en leest het antwoord als uitkomst.</p>

// De configuratie van de agent die je in het formulier hebt geopend: velden die
// geen eigen invoerveld hebben (zoals `omgeving`) blijven zo bewaard bij opslaan.
let bewaardeAgentConfig = {};
const AGENT_ADAPTERS = [
  { id: 'hermes', naam: 'Hermes Agent op deze machine', zin: 'Start de Hermes-CLI met de taak als opdracht. Zo werken de agents hier.' },
  { id: 'opdracht', naam: 'Een eigen commando', zin: 'Draait je eigen script of CLI; de taak komt mee als argument en in PLOEGBAAS_TAAK_OMSCHRIJVING.' },
  { id: 'http', naam: 'Een eigen endpoint', zin: 'Stuurt de taak als JSON naar je eigen adres en leest het antwoord als uitkomst.' },
];

function adapterStand(id) {
  const o = S.ontdek;
  if (id === 'hermes') {
    if (!o) return 'even kijken…';
    return o.hermes.gevonden
      ? `gevonden: ${o.hermes.versie || o.hermes.pad}`
      : 'niet gevonden op deze machine';
  }
  if (id === 'opdracht') return 'elk programma dat op deze machine staat';
  return 'elk adres dat JSON aanneemt';
}

// Wat deze machine kan (hermes? modellen? eigen model?) — lui opgehaald zodra je
// de agentenpagina opent, zodat het dashboard zelf snel blijft.
function zorgOntdek() {
  if (S.ontdek || S.ontdekBezig) return;
  S.ontdekBezig = true;
  api('/agenten/ontdek')
    .then((o) => {
      S.ontdek = o;
      S.ontdekBezig = false;
      if (S.pad.startsWith('/agenten')) teken();
    })
    .catch(() => { S.ontdekBezig = false; });
}

function agentFormulier(a = {}) {
  const c = a.adapter_config ? JSON.parse(a.adapter_config || '{}') : {};
  bewaardeAgentConfig = c;   // omgeving e.d. bewaren bij het opslaan (zie adapterConfigUitVelden)
  const adapter = a.adapter || S.agentAdapter || 'hermes';
  S.agentAdapter = adapter;
  const o = S.ontdek || {};
  const aliasLijst = (o.modellen || []).map((m) => `<option value="${esc(m.naam)}">${esc(m.model)}${m.provider ? ' · ' + esc(m.provider) : ''}</option>`).join('');
  const args = Array.isArray(c.args) ? c.args.join(' ') : (adapter === 'hermes' ? 'chat -q' : '');
  return `<div class="paneel koppel">
    <div class="koppel-kop"><b>${a.id ? esc(a.naam) + ' aanpassen' : 'Een agent koppelen'}</b>
      <span class="rechts"><button class="knop los klein" onclick="sluitAgentFormulier()">Sluiten</button></span></div>
    <div class="koppel-lijf">
      <div class="stap"><b>1</b> Hoe werkt deze agent?</div>
      <div class="adapter-keuze">${AGENT_ADAPTERS.map((x) => `<button class="adapter-kaart ${adapter === x.id ? 'aan' : ''}" data-adapter="${x.id}" onclick="kiesAdapter('${x.id}')">
        <b>${x.naam}</b><span>${x.zin}</span><em>${esc(adapterStand(x.id))}</em></button>`).join('')}</div>
      <input type="hidden" id="a-adapter" value="${adapter}">

      <div id="velden-hermes" class="adaptervelden" style="display:${adapter === 'hermes' ? 'block' : 'none'}">
        <div class="veld"><label>Commando</label>
          <input id="a-commando-h" value="${esc(c.commando || 'hermes')}" placeholder="hermes">
          <div class="zacht" style="font-size:12px;margin-top:6px">Laat staan op <code>hermes</code>, tenzij je een eigen installatie gebruikt.</div></div>
      </div>
      <div id="velden-opdracht" class="adaptervelden" style="display:${adapter === 'opdracht' ? 'block' : 'none'}">
        <div class="rij">
          <div class="veld"><label>Commando</label><input id="a-commando-o" value="${esc(c.commando || '')}" placeholder="/home/iemand/mijn-script.sh"></div>
          <div class="veld"><label>Argumenten (spatie ertussen)</label><input id="a-args-o" value="${esc(args)}" placeholder="--stil"></div>
        </div>
        <div class="veld"><label>Omgeving (JSON, mag leeg blijven)</label>
          <textarea id="a-omgeving-o" rows="3" placeholder='{"MIJN_URL": "http://192.168.1.50:8642"}'>${esc(c.omgeving && Object.keys(c.omgeving).length ? JSON.stringify(c.omgeving) : '')}</textarea>
          <div class="zacht" style="font-size:12px;margin-top:6px">Extra omgevingsvariabelen voor dit commando, bijvoorbeeld het adres en het sleutelbestand van een agent elders. Zonder dit vak overschrijf je ze bij het opslaan niet meer — ze blijven bewaard.</div></div>
        <div class="zacht" style="font-size:12px">De opdracht komt als laatste argument mee, en als <code>PLOEGBAAS_TAAK_OMSCHRIJVING</code> in de omgeving.</div>
      </div>
      <div id="velden-http" class="adaptervelden" style="display:${adapter === 'http' ? 'block' : 'none'}">
        <div class="veld"><label>Adres</label><input id="a-url-w" value="${esc(c.url || '')}" placeholder="http://192.168.1.50:8080/taak">
          <div class="zacht" style="font-size:12px;margin-top:6px">Ploegbaas stuurt de taak als JSON en leest het antwoord als uitkomst.</div></div>
      </div>

      <div class="stap"><b>2</b> Wie is het?</div>
      <div class="rij">
        <div class="veld"><label>Naam</label><input id="a-naam" value="${esc(a.naam || '')}" placeholder="bijv. Wout"></div>
        <div class="veld"><label>Rol</label><input id="a-rol" value="${esc(a.rol || 'algemeen')}"></div>
      </div>
      <div class="veld"><label>Titel</label><input id="a-titel" value="${esc(a.titel || '')}" placeholder="bijv. Website-beheerder"></div>

      <div class="stap"><b>3</b> Waarmee en hoeveel?</div>
      <div class="rij">
        <div class="veld"><label>Model</label>
          <input id="a-model" list="modellen" value="${esc(a.model || '')}" placeholder="${esc(o.standaard_model || 'laat leeg voor eigen keuze')}">
          <datalist id="modellen">${aliasLijst}</datalist></div>
        <div class="veld"><label>Budget per maand (euro, 0 = geen)</label><input id="a-budget" type="number" value="${((a.budget_maand_centen || 0) / 100).toFixed(0)}"></div>
      </div>
      <div class="zacht" style="font-size:12px">${(o.modellen || []).length
        ? 'Aliassen op deze machine: ' + o.modellen.map((m) => `<code>${esc(m.naam)}</code>`).join(', ') + '. Je mag ook een eigen modelnaam typen.'
        : 'Geen aliassen gevonden in <code>~/.hermes/config.yaml</code>; typ de modelnaam die de agent moet gebruiken.'}</div>
      <div class="rij">
        <div class="veld"><label>Hartslag</label><select id="a-hartslag">
          <option value="0" ${!a.heartbeat_aan ? 'selected' : ''}>uit</option>
          <option value="1" ${a.heartbeat_aan ? 'selected' : ''}>aan</option></select></div>
        <div class="veld"><label>Elke (minuten)</label><input id="a-minuten" type="number" value="${a.heartbeat_minuten || 30}"></div>
        <div class="veld"><label>Tijdslimiet (seconden)</label><input id="a-timeout" type="number" value="${c.timeout_seconden || 1800}"></div>
      </div>

      <div class="stap"><b>4</b> Testen, dan koppelen</div>
      <div id="proefuitslag" class="proef zacht">Nog niet getest. Met <b>Testen</b> laat je deze agent één echte opdracht van drie woorden uitvoeren.</div>
    </div>
    <div class="koppel-voet">
      <button class="knop los" id="proefknop" onclick="testAgent()">Testen</button>
      <button class="knop" onclick="bewaarAgent(${a.id || 0})">${a.id ? 'Opslaan' : 'Koppelen'}</button>
      <span class="rechts zacht" style="font-size:12px">De proef kost één run van een paar seconden (of langer bij een eigen model).</span>
    </div>
  </div>`;
}

function kiesAdapter(id) {
  S.agentAdapter = id;
  const verborgen = document.getElementById('a-adapter');
  if (verborgen) verborgen.value = id;
  document.querySelectorAll('.adapter-kaart').forEach((k) => k.classList.toggle('aan', k.dataset.adapter === id));
  for (const x of ['hermes', 'opdracht', 'http']) {
    const vak = document.getElementById('velden-' + x);
    if (vak) vak.style.display = x === id ? 'block' : 'none';
  }
}

function sluitAgentFormulier() {
  const vak = document.getElementById('agentformulier');
  if (vak) vak.innerHTML = '';
  S.agentAdapter = null;
}

function nieuweAgent() {
  zorgOntdek();
  S.agentAdapter = null;
  document.getElementById('agentformulier').innerHTML = agentFormulier();
  document.getElementById('agentformulier').scrollIntoView({ behavior: 'smooth' });
}

// Snel koppelen: de server zoekt zelf uit hoe deze machine werkt (Hermes gevonden,
// standaardmodel) en toetst met één echte proef. Lukt die, dan staat de agent erin.
async function snelKoppelen(toch = false) {
  const knop = document.getElementById('snelknop');
  const vak = document.getElementById('sneluitslag');
  if (knop) { knop.disabled = true; knop.textContent = 'Koppelen…'; }
  if (vak) vak.innerHTML = '<div class="proef zacht">Bezig: instellingen opzoeken en één proefopdracht laten uitvoeren. Bij een eigen (lokaal) model kan dit een halve minuut duren.</div>';
  try {
    const r = await api('/agenten/snelkoppelen', { method: 'POST', lijf: { toch } });
    S.snelUitslag = uitslagSnel(r);
    if (r.gekoppeld) await laadAlles();
    else teken();
  } catch (fout) {
    S.snelUitslag = `<div class="proef fout">${esc(fout.message)}</div>`;
    teken();
  } finally {
    const k2 = document.getElementById('snelknop');
    if (k2) { k2.disabled = false; k2.textContent = 'Snel koppelen'; }
  }
}

function uitslagSnel(r) {
  const duur = (Number(r.proef?.duur_ms || 0) / 1000).toFixed(1).replace('.', ',');
  if (r.gekoppeld) {
    const a = r.agent || {};
    return `<div class="proef goed"><b>Gekoppeld: ${esc(a.naam || '')}</b>
      <span class="zacht"> · proef ${r.proef?.ok ? 'geslaagd' : 'mislukt, toch gekoppeld'} in ${duur} s · model ${esc(a.model || 'eigen keuze')} · hartslag ${a.heartbeat_aan ? 'elke ' + a.heartbeat_minuten + ' min' : 'uit'}</span>
      <div class="zacht" style="margin-top:6px">Hij staat nu in de lijst. Maak een taak en wijs hem aan ${esc(a.naam || 'deze agent')} toe; de hartslag pakt hem meteen op.</div></div>`;
  }
  return `<div class="proef fout"><b>Nog niet gekoppeld</b>
    <span class="zacht"> · de proef antwoordde niet (${duur} s, code ${esc(String(r.proef?.code ?? ''))})</span>
    ${r.proef?.fout ? `<div style="margin-top:6px">${esc(r.proef.fout)}</div>` : ''}
    ${r.proef?.uitvoer ? `<div class="logvak" style="max-height:110px;margin-top:8px">${esc(r.proef.uitvoer)}</div>` : ''}
    <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="knop los klein" onclick="snelKoppelen(true)">Toch koppelen</button>
      <button class="knop los klein" onclick="nieuweAgent()">Zelf samenstellen</button>
    </div></div>`;
}

function bewerkAgent(id) {
  const a = S.agenten.find((x) => x.id === id);
  S.agentAdapter = a.adapter;
  document.getElementById('agentformulier').innerHTML = agentFormulier(a);
  document.getElementById('agentformulier').scrollIntoView({ behavior: 'smooth' });
}

function adapterConfigUitVelden() {
  const a = document.getElementById('a-adapter').value;
  const timeout = Number(document.getElementById('a-timeout')?.value || 1800);
  if (a === 'http') return { url: document.getElementById('a-url-w').value.trim(), timeout_seconden: timeout };
  if (a === 'opdracht') {
    const argsTekst = (document.getElementById('a-args-o').value || '').trim();
    const omgevingTekst = (document.getElementById('a-omgeving-o')?.value || '').trim();
    let omgeving;
    if (omgevingTekst) {
      try { omgeving = JSON.parse(omgevingTekst); }
      catch { alert('De omgeving is geen geldige JSON. Laat het vak leeg of zet er bijvoorbeeld {"URL": "http://…"} in.'); return null; }
      if (!omgeving || typeof omgeving !== 'object' || Array.isArray(omgeving)) { alert('De omgeving moet een JSON-object zijn, bijvoorbeeld {"URL": "http://…"}.'); return null; }
    }
    // Zonder dit blijft de omgeving van een gekoppelde agent elders bewaard in
    // plaats van hem bij elke opslag te wissen; het vak hierboven is de enige
    // plek waar je hem nog ziet en aanpast.
    const vorige = bewaardeAgentConfig.omgeving || {};
    const samen = { ...vorige, ...(omgeving || {}) };
    const uit = {
      commando: document.getElementById('a-commando-o').value.trim(),
      args: argsTekst ? argsTekst.split(/\s+/) : [],
      timeout_seconden: timeout,
    };
    if (Object.keys(samen).length) uit.omgeving = samen;
    return uit;
  }
  return {
    commando: document.getElementById('a-commando-h').value.trim() || 'hermes',
    args: ['chat', '-q'],
    timeout_seconden: timeout,
  };
}

function proefLijf() {

function toonProef(r) {
  const vak = document.getElementById('proefuitslag');
  if (!vak) return;
  const duur = (Number(r.duur_ms || 0) / 1000).toFixed(1).replace('.', ',');
  vak.className = 'proef ' + (r.ok ? 'goed' : 'fout');
  vak.innerHTML = `<b>${r.ok ? 'Deze agent antwoordt' : 'Deze agent antwoordt niet'}</b>
    <span class="zacht"> · ${duur} s · code ${esc(String(r.code))}</span>
    ${r.fout ? `<div style="margin-top:6px">${esc(r.fout)}</div>` : ''}
    ${r.uitvoer ? `<div class="logvak" style="max-height:130px;margin-top:8px">${esc(r.uitvoer)}</div>` : '<div class="zacht" style="margin-top:6px">Geen uitvoer ontvangen.</div>'}`;
}

async function testAgent() {
  const knop = document.getElementById('proefknop');
  const vak = document.getElementById('proefuitslag');
  if (knop) { knop.disabled = true; knop.textContent = 'Testen…'; }
  if (vak) { vak.className = 'proef zacht'; vak.textContent = 'Bezig — bij een eigen (lokaal) model kan dit een halve minuut duren.'; }
  try {
    const lijf = proefLijf();
    if (!lijf || !lijf.adapter_config) { if (vak) { vak.className = 'proef fout'; vak.textContent = 'De agent-configuratie klopt niet; zie de melding hierboven.'; } return; }
    toonProef(await api('/agenten/proef', { method: 'POST', lijf }));
  } catch (fout) {
    if (vak) { vak.className = 'proef fout'; vak.textContent = fout.message; }
  } finally {
    if (knop) { knop.disabled = false; knop.textContent = 'Testen'; }
  }
}

async function bewaarAgent(id) {
  const lijf = {
    ...proefLijf(),
    naam: document.getElementById('a-naam').value.trim(),
    rol: document.getElementById('a-rol').value.trim() || 'algemeen',
    titel: document.getElementById('a-titel').value.trim(),
    heartbeat_aan: document.getElementById('a-hartslag').value === '1',
    heartbeat_minuten: Number(document.getElementById('a-minuten').value || 30),
    budget_maand_centen: Math.round(Number(document.getElementById('a-budget').value || 0) * 100),
  };
  if (!lijf.naam) return alert('Geef de agent eerst een naam.');
  if (!lijf.adapter_config) return;   // de melding stond al in het formulier
  if (lijf.adapter === 'http' && !lijf.adapter_config.url) return alert('Vul het adres van je endpoint in.');
  if (lijf.adapter === 'opdracht' && !lijf.adapter_config.commando) return alert('Vul het commando in dat deze agent moet draaien.');
  const uitslag = document.getElementById('proefuitslag');
  const getest = uitslag && uitslag.classList.contains('goed');
  if (!getest) {
    const door = confirm('Deze agent is nog niet getest. Toch koppelen? Je kunt hem later altijd nog testen.');
    if (!door) return;
  }
  try {
    if (id) await api('/agenten/' + id, { method: 'PATCH', lijf });
    else await api('/agenten', { method: 'POST', lijf });
  } catch (fout) { return alert(fout.message); }
  sluitAgentFormulier();
  await laadAlles();
}

  const stand = await api('/bijwerken/log').catch(() => null);

    S.bijwerkLog = stand;
    const vak = document.getElementById('bijwerklog');
    if (vak) { vak.textContent = stand.tekst || 'bezig…'; vak.scrollTop = vak.scrollHeight; }

async function laadAlles() {
  try {
    const [overzicht, taken, agenten, runs, goedkeuringen, routines, activiteit, meldingen, versie] = await Promise.all([
      api('/overzicht'), api('/taken'), api('/agenten'), api('/runs?limiet=60'),
      api('/goedkeuringen'), api('/routines'), api('/activiteit'), api('/meldingen'),
      api('/versie').catch(() => null),
    ]);
    Object.assign(S, { overzicht, taken, agenten, runs, goedkeuringen, routines, activiteit, meldingen, versie });
    S.ingelogd = true;
    if (S.pad.startsWith('/taken/')) await laadTaak(Number(S.pad.split('/')[2]), false);
    teken();
  } catch (e) { if (S.ingelogd !== false) console.error(e); }
}

async function laadTaak(id, herteken = true) {
  S.taak = await api('/taken/' + id);
  if (herteken) teken();
}

window.addEventListener('hashchange', () => {
  S.pad = location.hash.replace(/^#/, '') || '/dashboard';
  if (S.pad.startsWith('/taken/')) laadTaak(Number(S.pad.split('/')[2])); else teken();
});

// live bijwerken: ploegbaas stuurt gebeurtenissen over /api/stromen
try {
  const stroom = new EventSource('/api/stromen');
  let wacht = null;
  stroom.onmessage = (bericht) => {
    const data = JSON.parse(bericht.data);
    if (data.soort === 'hallo') return;
    if (data.soort === 'log' && S.runLog && S.runLog.id === data.runId) {
      S.runLog.tekst += data.stuk;
      const vak = document.getElementById('runlog');
      if (vak) { vak.textContent = S.runLog.tekst; vak.scrollTop = vak.scrollHeight; }
      return;
    }
    clearTimeout(wacht);
    wacht = setTimeout(laadAlles, 900);
  };
} catch (e) { /* zonder live kanaal blijft alles werken */ }

(async () => { await laadAlles(); })();
</script>
</body>
</html>
